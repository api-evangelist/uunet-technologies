name: UUNET Technologies
description: UUNET Technologies was one of the first commercial Internet service
  providers, founded in 1987 by Rick Adams in Virginia to commercialize Usenet and
  email, launching the AlterNet IP backbone in 1990. Backed by Accel Partners,
  Menlo Ventures, and NEA, it IPO'd on NASDAQ in 1995, was acquired by MFS
  Communications for $2B in 1996, which WorldCom bought that same year; after the
  MCI merger and Verizon's 2006 acquisition the UUNET brand was retired into
  Verizon Business. The brand is defunct today - its legacy domains (uu.net,
  uunet.com) remain Verizon-operated DNS zones whose web hosts only redirect to
  verizon.com/business, and it publishes no APIs or developer surface.
